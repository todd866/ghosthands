[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosthands"
version = "0.1.0"
description = "DOM-independent GUI automation using vision models and USB HID hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
ghosthands = "ghosthands.cli:main"

[tool.setuptools]
packages = ["ghosthands"]
